# E2E real del instalador en un Ubuntu limpio (Docker). Manual por diseño:
# prepara Node 22 e instala bun + pi desde la red dentro del contenedor, así que
# es más lento y frágil que la CI normal — se lanza antes de publicar una
# release o cuando se toca el instalador a fondo.
name: e2e

on:
  workflow_dispatch:
    inputs:
      release_update_target:
        description: "Tag publicado que probar desde installer-v0.95.0-alpha.3 antes de cortar otra release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  ubuntu-install:
    if: ${{ inputs.release_update_target == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: E2E install en Docker (Ubuntu)
        run: ./e2e/docker-test.sh

  published-upgrade:
    if: ${{ inputs.release_update_target != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probar actualización desde una release publicada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_UPDATE_TARGET: ${{ inputs.release_update_target }}
        run: ./e2e/release-update-test.sh installer-v0.95.0-alpha.3 "$RELEASE_UPDATE_TARGET"
