name: installer-release

# Publishes the Ein installer binaries on tag push `installer-v*`.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing installer tag to publish"
        required: true
        type: string
      allow_non_main_tag:
        description: "Escape hatch for a deliberate hotfix from a maintenance branch: skip the tip-of-main check"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Resolve release tag
        id: resolve_release_tag
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$PUSH_TAG"
          fi

          semver_re='^installer-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$release_tag" =~ $semver_re ]]; then
            echo "Release tag must use canonical installer-v<semver> syntax" >&2
            exit 1
          fi

          version="${release_tag#installer-v}"
          version_without_build="${version%%+*}"
          prerelease=""
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Release tag contains a leading-zero prerelease identifier: $release_tag" >&2
                exit 1
              fi
            done
          fi

          release_channel="stable"
          case "$prerelease" in
            "") ;;
            alpha|alpha.*) release_channel="alpha" ;;
            *)
              echo "Unsupported installer prerelease channel: $release_tag" >&2
              exit 1
              ;;
          esac

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve_release_tag.outputs.release_tag }}
          fetch-depth: 0

      # `installer-v0.73.0` se publicó vacío: el tag apuntaba a un ancestro de
      # `main` (el merge de un PR anterior), no a su punta, así que el build
      # empaquetó código viejo aunque `INSTALLER_VERSION` ya llevaba el número
      # nuevo — comparar versiones no lo habría detectado. El checkout de un
      # tag deja el repo en detached HEAD sin `main` local, así que hace falta
      # traerla explícitamente. `fetch-depth: 0` trae el historial completo:
      # un checkout superficial haría fallar esta comparación por un motivo
      # falso (falta de commits), que sería peor que no tener el guardarraíl.
      - name: Verify tagged commit is the tip of main
        working-directory: .
        env:
          ALLOW_NON_MAIN_TAG: ${{ inputs.allow_non_main_tag }}
        run: |
          git fetch origin main
          tagged_commit="$(git rev-parse HEAD)"
          main_tip="$(git rev-parse origin/main)"
          if [[ "$tagged_commit" != "$main_tip" ]]; then
            if [[ "$ALLOW_NON_MAIN_TAG" == "true" ]]; then
              echo "::warning::ALLOW_NON_MAIN_TAG=true: publishing $tagged_commit, which is NOT the tip of main ($main_tip). Only use this for a deliberate hotfix from a maintenance branch."
            else
              echo "::error::Tagged commit $tagged_commit is not the tip of main ($main_tip)." >&2
              echo "This tag was created from a commit that main has already moved past — publishing it ships stale code under a new version number, exactly what broke installer-v0.73.0." >&2
              echo "Fix: delete this tag, cut a NEW installer-v<semver> tag from the current tip of main, and push that instead. Never move an already-published tag." >&2
              echo "Legitimate hotfix from a maintenance branch: re-run this workflow via workflow_dispatch with allow_non_main_tag=true." >&2
              exit 1
            fi
          fi

      - name: Verify release metadata coherence
        working-directory: .
        env:
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: |
          release_version="${RELEASE_TAG#installer-v}"
          package_version="$(jq -er '.version | strings' installer/package.json)"
          source_version="$(sed -nE 's/^export const INSTALLER_VERSION = "([^"]+)";/\1/p' installer/src/core/version.ts)"
          changelog_version="$(awk '/^## \[[^]]+\]/{value=$0; sub(/^## \[/, "", value); sub(/\].*$/, "", value); print value; exit}' CHANGELOG.md)"

          if [[ -z "$package_version" || -z "$source_version" || -z "$changelog_version" ]]; then
            echo "Release metadata is missing a version pointer" >&2
            exit 1
          fi
          if [[ "$release_version" != "$package_version" || "$release_version" != "$source_version" || "$release_version" != "$changelog_version" ]]; then
            echo "Release tag $RELEASE_TAG disagrees with installer/package.json, INSTALLER_VERSION, or the leading changelog release" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # La app de terminal se compila desde las fuentes de la RAÍZ
      # (`ein-pi/agent/app.ts`), que importan `@opentui/core` y `solid-js`. Sin
      # las dependencias de la raíz instaladas, `build:all` no las resuelve.
      #
      # `--cpu=* --os=*` NO es decoración: `@opentui/core` carga su binario
      # nativo con un `import("@opentui/core-<os>-<arch>")` dinámico, y esos
      # paquetes son opcionales por plataforma. Un runner Linux solo instalaría
      # el suyo, así que los tres cross-compiles restantes fallarían con
      # "Could not resolve: @opentui/core-darwin-arm64". Los cuatro targets se
      # compilan desde una sola máquina: hacen falta los cuatro binarios.
      - name: Install root deps (todas las plataformas — cross-compile)
        working-directory: .
        run: bun install --frozen-lockfile --cpu='*' --os='*'

      - name: Install installer deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build all targets (bundles template + cross-compiles)
        run: bun run build:all

      - name: Compiled BunFS payload smoke (Linux x64)
        run: |
          bun build scripts/cc-payload-smoke.ts \
            --compile \
            --target=bun-linux-x64 \
            --outfile /tmp/ein-cc-payload-smoke
          (cd /tmp && /tmp/ein-cc-payload-smoke)

      # Publication is the irreversible boundary. Exercise the candidate in
      # clean Ubuntu homes before checksumming and uploading those exact bytes.
      - name: Pre-publication installer E2E (Ubuntu)
        working-directory: .
        timeout-minutes: 45
        run: ./e2e/docker-test.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ein-installer-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ steps.resolve_release_tag.outputs.release_channel }}
        run: |
          release_version="$(jq -er '.version | strings' package.json)"
          release_prerelease_flag=""
          if [[ "$RELEASE_CHANNEL" == "alpha" ]]; then
            release_prerelease_flag="--prerelease"
            cat > /tmp/release-notes.md << 'EOF'
          Prerelease de Ein. Instala exactamente esta alpha con:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installer/install.sh | bash -s -- --release-channel alpha --release-tag __RELEASE_TAG__
          ```
          EOF
            sed -i.bak "s/__RELEASE_TAG__/$RELEASE_TAG/g" /tmp/release-notes.md
            rm /tmp/release-notes.md.bak
          else
            cat > /tmp/release-notes.md << 'EOF'
          Instalador de Ein. Instala la última versión estable con:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installer/install.sh | bash
          ```
          EOF
          fi
          gh release create "$RELEASE_TAG" \
            $release_prerelease_flag \
            --title "EIN v${release_version}" \
            --notes-file /tmp/release-notes.md \
            dist/ein-installer-darwin-arm64 \
            dist/ein-installer-darwin-x64 \
            dist/ein-installer-linux-arm64 \
            dist/ein-installer-linux-x64 \
            dist/checksums.txt \
            install.sh

      - name: Published release upgrade smoke
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: ../e2e/release-update-test.sh installer-v0.94.0-alpha.3 "$RELEASE_TAG"
