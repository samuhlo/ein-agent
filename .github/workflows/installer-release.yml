name: installer-release

# Publishes the Ein installer binaries on tag push `installer-v*`.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing installer tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Resolve release tag
        id: resolve_release_tag
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_RELEASE_TAG" =~ ^installer-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "workflow_dispatch requires an installer-v<full-semver> tag" >&2
              exit 1
            fi
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$PUSH_TAG"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve_release_tag.outputs.release_tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # La app de terminal se compila desde las fuentes de la RAÍZ
      # (`ein-pi/agent/app.ts`), que importan `@opentui/core` y `solid-js`. Sin
      # las dependencias de la raíz instaladas, `build:all` no las resuelve.
      - name: Install root deps
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install installer deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build all targets (bundles template + cross-compiles)
        run: bun run build:all

      - name: Compiled BunFS payload smoke (Linux x64)
        run: |
          bun build scripts/cc-payload-smoke.ts \
            --compile \
            --target=bun-linux-x64 \
            --outfile /tmp/ein-cc-payload-smoke
          (cd /tmp && /tmp/ein-cc-payload-smoke)

      - name: Checksums
        run: |
          cd dist
          sha256sum ein-installer-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          Instalador de Ein. Instala con:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installer/install.sh | bash
          ```
          EOF
          release_version="$(jq -er '.version | strings' package.json)"
          gh release create "$RELEASE_TAG" \
            --title "EIN v${release_version}" \
            --notes-file /tmp/release-notes.md \
            dist/ein-installer-darwin-arm64 \
            dist/ein-installer-darwin-x64 \
            dist/ein-installer-linux-arm64 \
            dist/ein-installer-linux-x64 \
            dist/checksums.txt \
            install.sh
