name: installer-release

# Publishes the Ein installer binaries on tag push `installer-v*`.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing main tag, or new hotfix tag to publish"
        required: true
        type: string
      maintenance_branch:
        description: "Hotfix only: maintenance/<base-version> from a published alpha"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: installer-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Resolve release tag
        id: resolve_release_tag
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_MAINTENANCE_BRANCH: ${{ inputs.maintenance_branch }}
          DISPATCH_REF: ${{ github.ref }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$PUSH_TAG"
          fi

          semver_re='^installer-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$release_tag" =~ $semver_re ]]; then
            echo "Release tag must use canonical installer-v<semver> syntax" >&2
            exit 1
          fi

          version="${release_tag#installer-v}"
          version_without_build="${version%%+*}"
          prerelease=""
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Release tag contains a leading-zero prerelease identifier: $release_tag" >&2
                exit 1
              fi
            done
          fi

          release_channel="stable"
          case "$prerelease" in
            "") ;;
            alpha|alpha.*) release_channel="alpha" ;;
            *)
              echo "Unsupported installer prerelease channel: $release_tag" >&2
              exit 1
              ;;
          esac

          hotfix=false
          source_ref="$release_tag"
          base_tag=""
          if [[ -n "$INPUT_MAINTENANCE_BRANCH" ]]; then
            hotfix_re='^installer-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)\.([1-9][0-9]*)$'
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$DISPATCH_REF" != "refs/heads/main" || ! "$release_tag" =~ $hotfix_re ]]; then
              echo "Hotfix publication requires workflow_dispatch from main and installer-vX.Y.Z-alpha.N.H" >&2
              exit 1
            fi
            base_tag="installer-v${version%.*}"
            expected_branch="maintenance/${version%.*}"
            if [[ "$INPUT_MAINTENANCE_BRANCH" != "$expected_branch" ]]; then
              echo "Expected maintenance branch $expected_branch" >&2
              exit 1
            fi
            hotfix=true
            source_ref="$INPUT_MAINTENANCE_BRANCH"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "hotfix=$hotfix" >> "$GITHUB_OUTPUT"
          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "maintenance_branch=$INPUT_MAINTENANCE_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve_release_tag.outputs.source_ref }}
          fetch-depth: 0

      # Normal releases use the exact main tip. A hotfix must be the exact tip
      # of its maintenance branch, descended from the published base tag and
      # produced by a merged PR. Recheck that tip before creating the tag.
      - name: Verify release source
        working-directory: .
        env:
          HOTFIX: ${{ steps.resolve_release_tag.outputs.hotfix }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
          MAINTENANCE_BRANCH: ${{ steps.resolve_release_tag.outputs.maintenance_branch }}
          BASE_TAG: ${{ steps.resolve_release_tag.outputs.base_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          candidate="$(git rev-parse HEAD)"
          if [[ "$HOTFIX" != "true" ]]; then
            if [[ "$candidate" != "$(git rev-parse origin/main)" ]]; then
              echo "Tagged commit is not the tip of main" >&2
              exit 1
            fi
          else
            git fetch origin "refs/heads/$MAINTENANCE_BRANCH:refs/remotes/origin/$MAINTENANCE_BRANCH" "refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
            base="$(git rev-parse "$BASE_TAG^{commit}")"
            if [[ "$(gh release view "$BASE_TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
              echo "Hotfix base must be a published alpha release" >&2
              exit 1
            fi
            if [[ "$candidate" != "$(git rev-parse "refs/remotes/origin/$MAINTENANCE_BRANCH")" ]] || ! git merge-base --is-ancestor "$base" "$candidate"; then
              echo "Hotfix must be the maintenance branch tip descended from $BASE_TAG" >&2
              exit 1
            fi
            if [[ "$(git merge-base "$candidate" origin/main)" != "$base" ]]; then
              echo "Maintenance branch contains later main commits" >&2
              exit 1
            fi
            changed="$(git diff --name-only "$base" "$candidate" -- . ':(exclude)CHANGELOG.md' ':(exclude)installer/package.json' ':(exclude)installer/src/core/version.ts')"
            if [[ -z "$changed" ]]; then
              echo "Hotfix contains no fix outside release metadata" >&2
              exit 1
            fi
            merged_pr="$(gh pr list --base "$MAINTENANCE_BRANCH" --state merged --limit 30 --json mergeCommit,number --jq ".[] | select(.mergeCommit.oid == \"$candidate\") | .number")"
            if [[ -z "$merged_pr" ]]; then
              echo "Hotfix tip must come from a merged PR" >&2
              exit 1
            fi
            checks="$(gh pr checks "$merged_pr" --json name,state)"
            for required in 'test (macos-latest)' 'test (ubuntu-latest)' 'docs-site'; do
              if ! jq -e --arg name "$required" 'any(.[]; .name == $name and .state == "SUCCESS")' <<< "$checks" >/dev/null; then
                echo "Hotfix PR is missing a passing check: $required" >&2
                exit 1
              fi
            done
            existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
            existing_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}")"
            if [[ -n "$existing_tag" && "${existing_commit%%$'\t'*}" != "$candidate" ]]; then
              echo "Hotfix tag exists at another commit or is not annotated" >&2
              exit 1
            fi
          fi

      - name: Verify release metadata coherence
        working-directory: .
        env:
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: |
          release_version="${RELEASE_TAG#installer-v}"
          package_version="$(jq -er '.version | strings' installer/package.json)"
          source_version="$(sed -nE 's/^export const INSTALLER_VERSION = "([^"]+)";/\1/p' installer/src/core/version.ts)"
          changelog_version="$(awk '/^## \[[^]]+\]/{value=$0; sub(/^## \[/, "", value); sub(/\].*$/, "", value); print value; exit}' CHANGELOG.md)"

          if [[ -z "$package_version" || -z "$source_version" || -z "$changelog_version" ]]; then
            echo "Release metadata is missing a version pointer" >&2
            exit 1
          fi
          if [[ "$release_version" != "$package_version" || "$release_version" != "$source_version" || "$release_version" != "$changelog_version" ]]; then
            echo "Release tag $RELEASE_TAG disagrees with installer/package.json, INSTALLER_VERSION, or the leading changelog release" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # La app de terminal se compila desde las fuentes de la RAÍZ
      # (`ein-pi/agent/app.ts`), que importan `@opentui/core` y `solid-js`. Sin
      # las dependencias de la raíz instaladas, `build:all` no las resuelve.
      #
      # `--cpu=* --os=*` NO es decoración: `@opentui/core` carga su binario
      # nativo con un `import("@opentui/core-<os>-<arch>")` dinámico, y esos
      # paquetes son opcionales por plataforma. Un runner Linux solo instalaría
      # el suyo, así que los tres cross-compiles restantes fallarían con
      # "Could not resolve: @opentui/core-darwin-arm64". Los cuatro targets se
      # compilan desde una sola máquina: hacen falta los cuatro binarios.
      - name: Install root deps (todas las plataformas — cross-compile)
        working-directory: .
        run: |
          bun install --frozen-lockfile --cpu='*' --os='*'
          bun update --latest --no-save --force --cpu='*' --os='*' @earendil-works/pi-coding-agent @earendil-works/pi-tui

      - name: Install installer deps
        run: bun install --frozen-lockfile

      - name: Verify latest Pi host and extensions
        working-directory: .
        run: bun tooling/verify-latest-pi-runtime.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build all targets (bundles template + cross-compiles)
        run: bun run build:all

      - name: Compiled BunFS payload smoke (Linux x64)
        run: |
          bun build scripts/cc-payload-smoke.ts \
            --compile \
            --target=bun-linux-x64 \
            --outfile /tmp/ein-cc-payload-smoke
          (cd /tmp && /tmp/ein-cc-payload-smoke)

      # Publication is the irreversible boundary. Exercise the candidate in
      # clean Ubuntu homes before checksumming and uploading those exact bytes.
      - name: Pre-publication installer E2E (Ubuntu)
        working-directory: .
        timeout-minutes: 45
        run: ./e2e/docker-test.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ein-installer-* > checksums.txt
          cat checksums.txt

      - name: Tag verified hotfix
        if: steps.resolve_release_tag.outputs.hotfix == 'true'
        working-directory: .
        env:
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
          MAINTENANCE_BRANCH: ${{ steps.resolve_release_tag.outputs.maintenance_branch }}
        run: |
          git fetch origin "refs/heads/$MAINTENANCE_BRANCH:refs/remotes/origin/$MAINTENANCE_BRANCH"
          candidate="$(git rev-parse HEAD)"
          if [[ "$candidate" != "$(git rev-parse "refs/remotes/origin/$MAINTENANCE_BRANCH")" ]]; then
            echo "Maintenance branch moved during the build" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          existing_commit="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$existing_tag" ]]; then
            if [[ "${existing_commit%%$'\t'*}" != "$candidate" ]]; then
              echo "Hotfix tag exists at another commit or is not annotated" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$candidate"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ steps.resolve_release_tag.outputs.release_channel }}
          HOTFIX: ${{ steps.resolve_release_tag.outputs.hotfix }}
        run: |
          release_version="$(jq -er '.version | strings' package.json)"
          release_prerelease_flag=""
          if [[ "$RELEASE_CHANNEL" == "alpha" ]]; then
            release_prerelease_flag="--prerelease"
            if [[ "$HOTFIX" == "true" ]]; then
              cat > /tmp/release-notes.md << 'EOF'
          Hotfix de Ein. Instala exactamente esta alpha con el bootstrap del mismo release:

          ```bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/__RELEASE_TAG__/install.sh | bash -s -- --release-channel alpha --release-tag __RELEASE_TAG__
          ```
          EOF
            else
              cat > /tmp/release-notes.md << 'EOF'
          Prerelease de Ein. Instala exactamente esta alpha con:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installer/install.sh | bash -s -- --release-channel alpha --release-tag __RELEASE_TAG__
          ```
          EOF
            fi
            sed -i.bak "s/__RELEASE_TAG__/$RELEASE_TAG/g" /tmp/release-notes.md
            rm /tmp/release-notes.md.bak
          else
            cat > /tmp/release-notes.md << 'EOF'
          Instalador de Ein. Instala la última versión estable con:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installer/install.sh | bash
          ```
          EOF
          fi
          gh release create "$RELEASE_TAG" \
            $release_prerelease_flag \
            --title "EIN v${release_version}" \
            --notes-file /tmp/release-notes.md \
            dist/ein-installer-darwin-arm64 \
            dist/ein-installer-darwin-x64 \
            dist/ein-installer-linux-arm64 \
            dist/ein-installer-linux-x64 \
            dist/checksums.txt \
            install.sh

      - name: Published release upgrade smoke
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
        run: ../e2e/release-update-test.sh installer-v0.95.0-alpha.3 "$RELEASE_TAG"
