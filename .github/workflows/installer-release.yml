name: installer-release

# Publishes the Ein installer binaries on tag push `installer-v*`.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build all targets (bundles template + cross-compiles)
        run: bun run build:all

      - name: Checksums
        run: |
          cd dist
          sha256sum ein-installer-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ein installer ${GITHUB_REF_NAME}" \
            --notes "Instalador de Ein. Instala con:\n\n\`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/installer/install.sh | bash\`" \
            dist/ein-installer-darwin-arm64 \
            dist/ein-installer-darwin-x64 \
            dist/ein-installer-linux-arm64 \
            dist/ein-installer-linux-x64 \
            dist/checksums.txt \
            install.sh
