name: OpenTUI Solid packaging spike

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/opentui-solid-packaging-spike.yml"
      - "spikes/opentui-solid-packaging/**"
  pull_request:
    paths:
      - ".github/workflows/opentui-solid-packaging-spike.yml"
      - "spikes/opentui-solid-packaging/**"

permissions:
  contents: read

concurrency:
  group: opentui-solid-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-proof:
    name: Native proof (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: spikes/opentui-solid-packaging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run scripts/build.ts ${{ matrix.target }}
      - run: EIN_SOURCE_REVISION=${{ github.sha }} bun run build:candidate -- ${{ matrix.target }}
      - run: bun run scripts/stage.ts ${{ matrix.target }}
      - run: bun run scripts/ci-evidence.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentui-solid-${{ matrix.target }}-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            spikes/opentui-solid-packaging/dist/opentui-solid-probe-${{ matrix.target }}
            spikes/opentui-solid-packaging/evidence/inventories/*-${{ matrix.target }}.json
            spikes/opentui-solid-packaging/evidence/native-${{ matrix.target }}.json
            spikes/opentui-solid-packaging/evidence/raw/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opentui-dashboard-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            spikes/opentui-solid-packaging/dist/ein-opentui-dashboard-${{ matrix.target }}
            spikes/opentui-solid-packaging/dist/ein-opentui-dashboard-${{ matrix.target }}.json
