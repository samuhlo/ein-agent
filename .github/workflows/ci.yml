name: ci

# Gate de calidad en cada push a main y cada PR: corre la suite (workbench +
# installer), el typecheck de ein-pi/cc-ein y del installer, y un smoke de empaquetado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Un job sano tarda ~2 min. Sin techo explícito, GitHub lo deja vivo 6 horas:
    # un cuelgue no falla, se queda ahí ocupando runner y sin decir nada.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `fish` hace falta de verdad: `tests/surface-wiring.test.ts` lanza los
      # launchers con `fish -c`. Lo que colgaba el job era la DESCARGA, medida
      # en el run 32169701416: `apt-get update` tardó 5s y desempaquetar 3s,
      # pero bajar 3,5 MB del mirror de Azure costó 4min22s a 13,7 kB/s, con
      # `xsel` —20 kB -— fallando tres veces seguidas a 60s por intento.
      #
      # De ahí las tres medidas: `--no-install-recommends` no baja `xsel` (es
      # clipboard, y en CI nadie lo usa), `Acquire::Timeout` abandona una
      # conexión estancada en 15s en vez de 60, y el timeout del paso convierte
      # lo que quede en un fallo visible con log en vez de un cuelgue mudo.
      #
      # El timeout va SIN transporte a propósito. Antes era `Acquire::http::`,
      # que solo cubre http: el runner resuelve el mirror de Azure a `Ign` y cae
      # a `https://archive.ubuntu.com`, así que el límite no se aplicaba a la
      # conexión que se colgaba. Medido en el log: coge los InRelease y se queda
      # mudo cuatro minutos y medio hasta que salta el timeout del paso.
      - name: Instalar Fish en Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          apt_opts=(
            -o Acquire::Retries=5
            -o Acquire::Timeout=15
            -o DPkg::Lock::Timeout=120
          )
          sudo -E apt-get update "${apt_opts[@]}"
          sudo -E apt-get install --yes --no-install-recommends "${apt_opts[@]}" fish
          fish --version

      - name: Instalar Fish en macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install fish


      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install installer deps
        working-directory: installer
        run: bun install --frozen-lockfile

      # Build the embedded template tarball BEFORE tests: it is git-ignored, so
      # CI must generate it, and deploy.ts statically imports it (required for
      # `bun build --compile` embedding, so it can't be made lazy). This step
      # also doubles as the packaging smoke.
      - name: Bundle template (packaging smoke + test prerequisite)
        working-directory: installer
        run: bun run bundle-template:host

      - name: Test (workbench + installer)
        run: bun test

      - name: Typecheck ein-pi + cc-ein
        run: bun run typecheck

      - name: Typecheck installer
        working-directory: installer
        run: bun run typecheck

  docs-site:
    # Build del sitio (bloqueante) + procedencia de las páginas (informativo).
    # fetch-depth: 0 es obligatorio: con checkout superficial los `verified_rev`
    # históricos no existen en el árbol y todo el informe de drift saldría
    # `unknown`, que es un verde que no comprueba nada.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependencias del sitio
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build del sitio (bloqueante)
        working-directory: docs-site
        run: bun run build

      - name: Tests del detector de drift
        run: bun test tests/docs-site-drift-detector.test.ts tests/docs-site-drift-report.test.ts

      - name: Procedencia de las páginas (informativo)
        continue-on-error: true
        run: bun ein-pi/agent/lib/docs-site-drift-detector.ts
