name: ci

# Gate de calidad en cada push a main y cada PR: corre la suite (workbench +
# installer), el typecheck de ein-pi/ein-cc y del installer, y un smoke de empaquetado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Un job sano tarda ~2 min. Sin techo explícito, GitHub lo deja vivo 6 horas:
    # un cuelgue no falla, se queda ahí ocupando runner y sin decir nada.
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 es obligatorio: `tests/apply-corpus-frozen.test.ts` regenera
      # el corpus desde el historial (`git log`/`ls-tree`/`show` sobre el commit
      # base). Con checkout superficial ese historial no existe y el congelado no
      # se puede verificar.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Los launchers se prueban con Fish real. APT necesita timeouts por
      # transporte: Acquire::Timeout no limita las esperas HTTP/HTTPS.
      # HTTPS evita la ruta HTTP lenta observada en los runners; las pruebas
      # no necesitan traducciones de los índices ni paquetes recomendados.
      - name: Instalar Fish en Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          apt_opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::Languages=none
            -o DPkg::Lock::Timeout=120
          )
          sudo -E apt-get update "${apt_opts[@]}"
          sudo -E apt-get install --yes --no-install-recommends "${apt_opts[@]}" fish
          fish --version

      - name: Instalar Fish en macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install fish


      - name: Install root deps against latest Pi
        run: |
          bun install --frozen-lockfile
          bun run sync:pi

      - name: Install installer deps
        working-directory: installer
        run: bun install --frozen-lockfile

      - name: Verify latest Pi host and extensions
        run: bun tooling/verify-latest-pi-runtime.ts

      # Build the embedded template tarball BEFORE tests: it is git-ignored, so
      # CI must generate it, and deploy.ts statically imports it (required for
      # `bun build --compile` embedding, so it can't be made lazy). This step
      # also doubles as the packaging smoke.
      - name: Bundle template (packaging smoke + test prerequisite)
        working-directory: installer
        run: bun run bundle-template:host

      - name: Test (workbench + installer)
        # El mismo SHA de la PR #288 pasó en macOS y, al relanzarlo sin cambiar
        # un byte, agotó cuatro tests en 6,4–9,9 s (job 99860268707). Ubuntu
        # agotó después otro en 7,98 s (job 99863277588). El job completo aún
        # limita los cuelgues a 15 min. Volver a 5 s cuando 20 runs consecutivos
        # por SO terminen la suite en <3 min y ningún test supere 4 s.
        run: bun test --timeout 15000

      - name: Typecheck ein-pi + ein-cc
        run: bun run typecheck

      - name: Typecheck installer
        working-directory: installer
        run: bun run typecheck

  docs-site:
    # Build del sitio (bloqueante) + procedencia de las páginas (informativo).
    # fetch-depth: 0 es obligatorio: con checkout superficial los `verified_rev`
    # históricos no existen en el árbol y todo el informe de drift saldría
    # `unknown`, que es un verde que no comprueba nada.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependencias del sitio
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build del sitio (bloqueante)
        working-directory: docs-site
        run: bun run build

      # Los tests del detector NO se ejecutan aquí: ya corren en el job `test`,
      # que tambien usa `fetch-depth: 0` y ademas instala las dos instalaciones
      # del repo. Repetirlos en un job que solo instala `docs-site/` obligaba a
      # instalar la raiz y el installer para nada, y desde el guardian de
      # dependencias eso ni siquiera es posible: el preload corta la suite.
      - name: Fuentes declaradas de las páginas (bloqueante)
        run: bun ein-pi/agent/lib/docs-site-drift-detector.ts --check-sources

      - name: Frescura de las páginas (informativo)
        continue-on-error: true
        run: bun ein-pi/agent/lib/docs-site-drift-detector.ts
