name: ci

# Gate de calidad en cada push a main y cada PR: corre la suite (workbench +
# installer), el typecheck del installer y un smoke de empaquetado del template.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.0"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install installer deps
        working-directory: installer
        run: bun install --frozen-lockfile

      # Build the embedded template tarball BEFORE tests: it is git-ignored, so
      # CI must generate it, and deploy.ts statically imports it (required for
      # `bun build --compile` embedding, so it can't be made lazy). This step
      # also doubles as the packaging smoke.
      - name: Bundle template (packaging smoke + test prerequisite)
        working-directory: installer
        run: bun run bundle-template

      - name: Test (workbench + installer)
        run: bun test

      - name: Typecheck installer
        working-directory: installer
        run: bun run typecheck

  docs-contract:
    # Contrato de páginas de docs-site (bloqueante) + drift de fuentes
    # (informativo). fetch-depth: 0 es obligatorio: con checkout superficial
    # los `verified_rev` históricos no existen en el árbol y todo el informe de
    # drift sale `unknown`/`rev-not-found`, que es un verde que no comprueba nada.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Contrato de páginas (bloqueante)
        run: bun test tests/docs-site-contract.test.ts

      - name: Tests del detector de drift
        run: bun test tests/docs-site-drift-detector.test.ts tests/docs-site-drift-report.test.ts

      - name: Drift de fuentes sobre las 21 páginas reales (informativo)
        continue-on-error: true
        run: bun ein-pi/agent/lib/docs-site-drift-detector.ts
