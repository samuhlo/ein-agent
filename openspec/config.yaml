strict_tdd: true
context: |
  ein-installer is a Node.js/TypeScript ESM project.
  Detected markers: installer/package.json, installer/tsconfig.json, installer/bun package manager, GitHub Actions.
  Package managers: bun.
  Additional evidence: 94 test files detected in tests/; examples: tests/agent-frontmatter-json.test.ts (22 passing), tests/core-parity-coordinator.test.ts, tests/agent-tools-contract.test.ts.
  Test runner: bun test (v1.3.14) — 22/22 tests pass in smoke run on agent-frontmatter-json.test.ts.
  Unit tests: multiple (see tests/).
  Integration tests: multiple (see tests/).
  E2E tests: multiple (see tests/).
rules:
  design:
    require_problem_statement: true
    require_acceptance_criteria: true
  apply:
    test_command: "bun test"
  verify:
    test_command: "bun test"
testing:
  detected: "2026-08-07"
  runner:
    command: "bun test"
    framework: "bun test"
  layers:
    unit: "tests/"
    integration: "tests/"
    e2e: "tests/"
  commands:
    unit:
      - "bun test tests/"
    integration:
      - "bun test tests/"
    e2e:
      - "bun test tests/"
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: "cd installer && bun run typecheck"
  typecheck_commands:
    - scope: "installer"
      command: "cd installer && bun run typecheck"
      framework: "type checker"
  format: ""
  format_commands:
    []
